name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Performance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.6'
      - name: Check measurement validators
        run: python3 -m unittest discover -s scripts/performance -p 'test_*.py'
      - name: Resolve trusted policy and sources
        id: policy
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          base="$EVENT_BASE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            base=$(git rev-parse HEAD^)
          fi
          # Execute the established driver from the exact base, never PR policy.
          # Its own bootstrap validation rejects a partially introduced harness.
          if git cat-file -e "$base:scripts/performance/run.py" 2>/dev/null; then
            git show "$base:scripts/performance/run.py" > "$RUNNER_TEMP/performance-driver.py"
          else
            cp scripts/performance/run.py "$RUNNER_TEMP/performance-driver.py"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          python3 "$RUNNER_TEMP/performance-driver.py" \
            --source "$GITHUB_WORKSPACE" --base "$base" --candidate "$candidate" \
            --output "$RUNNER_TEMP/performance-results" --ci-config "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.policy.outputs.go-version }}
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.policy.outputs.bun-version }}
      - name: Measure immutable base and candidate
        env:
          BASE: ${{ steps.policy.outputs.base }}
          CANDIDATE: ${{ steps.policy.outputs.candidate }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 "$RUNNER_TEMP/performance-driver.py" \
            --source "$GITHUB_WORKSPACE" --base "$BASE" --candidate "$CANDIDATE" \
            --requested-head "$REQUESTED_HEAD" --output "$RUNNER_TEMP/performance-results" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-results
          path: ${{ runner.temp }}/performance-results/
          if-no-files-found: warn
          retention-days: 14
