name: Packages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Canonical release tag (for example impartus-cli-v0.1.27). Dispatch this workflow from the default branch and pass any historical tag here. Replaying an older stable tag moves rolling aliases.'
        required: true
        type: string

concurrency:
  group: packages-${{ (inputs.release_tag || github.event.release.tag_name) && 'release' || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish-ghcr:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}

      - name: Prepare image variables
        id: vars
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::warning::Replaying an older stable release moves latest and rolling version aliases; replay the newest release afterward to restore them."
          fi
          scripts/package-image-vars.sh "$RELEASE_TAG" "$RELEASE_DATE" "$EVENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify exact release tag
        if: ${{ steps.vars.outputs.mode == 'release' }}
        env:
          MODE: ${{ steps.vars.outputs.mode }}
          SOURCE_REF: ${{ steps.vars.outputs.source_ref }}
        run: |
          if [[ "$MODE" != "release" || ! "$SOURCE_REF" =~ ^refs/tags/impartus-cli-v[0-9A-Za-z.-]+$ ]]; then
            echo "Unexpected release source ref: $SOURCE_REF" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --refs origin "$SOURCE_REF" >/dev/null; then
            echo "Release tag does not exist: $SOURCE_REF" >&2
            exit 1
          fi

      - name: Checkout selected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.vars.outputs.source_ref || github.sha }}

      - name: Resolve source revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ steps.vars.outputs.mode == 'snapshot' }}
            type=sha,format=short,prefix=sha-,enable=${{ steps.vars.outputs.mode == 'snapshot' }}
            type=raw,value=${{ steps.vars.outputs.version }},enable=${{ steps.vars.outputs.mode == 'release' }}
            type=raw,value=${{ steps.vars.outputs.major_minor }},enable=${{ steps.vars.outputs.mode == 'release' && steps.vars.outputs.stable == 'true' }}
            type=raw,value=${{ steps.vars.outputs.major }},enable=${{ steps.vars.outputs.mode == 'release' && steps.vars.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.mode == 'release' && steps.vars.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=impartus-cli
            org.opencontainers.image.description=CLI and HTTP API for downloading Impartus lecture recordings.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ steps.vars.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.commit }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Build multi-platform OCI image for security gate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: impartus:prepublish-scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=/tmp/impartus-image,tar=false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            COMMIT=${{ steps.revision.outputs.commit }}

      - name: Scan linux/amd64 image before publish
        id: scan_amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: 'image'
          input: '/tmp/impartus-image'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-image-amd64-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan linux/arm64 image before publish
        id: scan_arm64
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: 'image'
          input: '/tmp/impartus-image'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-image-arm64-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Upload linux/amd64 Trivy SARIF results
        if: ${{ always() && github.event.repository.security_and_analysis.advanced_security.status == 'enabled' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-image-amd64-results.sarif
          category: trivy-image-amd64

      - name: Upload linux/arm64 Trivy SARIF results
        if: ${{ always() && github.event.repository.security_and_analysis.advanced_security.status == 'enabled' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-image-arm64-results.sarif
          category: trivy-image-arm64

      - name: Upload Trivy image reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-image-results
          path: |
            trivy-image-amd64-results.sarif
            trivy-image-arm64-results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Set up ORAS
        id: oras
        if: ${{ always() && steps.scan_amd64.outcome == 'success' && steps.scan_arm64.outcome == 'success' }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.2

      - name: Log in to GHCR
        id: login
        if: ${{ always() && steps.scan_amd64.outcome == 'success' && steps.scan_arm64.outcome == 'success' && steps.oras.outcome == 'success' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned multi-platform OCI image
        id: publish
        if: ${{ always() && steps.scan_amd64.outcome == 'success' && steps.scan_arm64.outcome == 'success' && steps.oras.outcome == 'success' && steps.login.outcome == 'success' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t image_refs <<< "$IMAGE_TAGS"
          if [[ ${#image_refs[@]} -eq 0 || -z "${image_refs[0]}" ]]; then
            echo "No image tags were generated" >&2
            exit 1
          fi

          expected_prefix="${IMAGE_NAME}:"
          destination="${image_refs[0]}"
          if [[ "$destination" != "$expected_prefix"* ]]; then
            echo "Unexpected image reference: $destination" >&2
            exit 1
          fi

          for image_ref in "${image_refs[@]:1}"; do
            if [[ "$image_ref" != "$expected_prefix"* ]]; then
              echo "Unexpected image reference: $image_ref" >&2
              exit 1
            fi
            destination+=",${image_ref#"$expected_prefix"}"
          done

          oras cp --from-oci-layout /tmp/impartus-image:prepublish-scan "$destination"

          local_digest="$(oras resolve --oci-layout /tmp/impartus-image:prepublish-scan)"
          published_digest="$(oras resolve "${image_refs[0]}")"
          if [[ "$local_digest" != "$published_digest" ]]; then
            echo "Published digest does not match the scanned OCI image" >&2
            exit 1
          fi
