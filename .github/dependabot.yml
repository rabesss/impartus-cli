# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    reviewers:
      - "rabesss"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # Enable version updates for Docker base images.
  # The Dockerfile pins dated tags (debian:bookworm-YYYYMMDD-slim@sha256) rather
  # than rolling ones. For a rolling tag Dependabot records the tag itself as the
  # version, so one closed digest PR (#75) suppressed every later debian refresh
  # (#304). A dated tag gives each Debian refresh its own version.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The golang tag must equal go.mod's Go version (container_build_test.go),
      # so a new Go minor needs a hand-made PR that bumps go.mod and the
      # analyzers too (#309). Patch bumps still arrive and need go.mod updated.
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "rabesss"
